<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meck Care Finder</title>
<meta name="description" content="Find mental health help in Mecklenburg County, NC: crisis lines, walk-in care, peer support and clinics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --ink:#12232B; --muted:#41545C; --line:#CBD8D5;
  --brand:#14506B; --on-brand:#FFFFFF; --soft:#E0EDF2;
  --crisis:#A6211A; --on-crisis:#FFFFFF; --crisis-soft:#FBE9E7;
  --ok:#1A6544; --ok-soft:#DCEFE5;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1B21; --surface:#15262E; --ink:#E9F2F1; --muted:#A9BCC1; --line:#2B424B;
    --brand:#8CCBE6; --on-brand:#0E1B21; --soft:#1B3641;
    --crisis:#FF8B80; --on-crisis:#2A0906; --crisis-soft:#3A1512;
    --ok:#7FD3A6; --ok-soft:#17352A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1B21; --surface:#15262E; --ink:#E9F2F1; --muted:#A9BCC1; --line:#2B424B;
  --brand:#8CCBE6; --on-brand:#0E1B21; --soft:#1B3641;
  --crisis:#FF8B80; --on-crisis:#2A0906; --crisis-soft:#3A1512;
  --ok:#7FD3A6; --ok-soft:#17352A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:32.5rem;margin:0 auto;padding:0 1.125rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
button{font:inherit}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;min-height:3.5rem;gap:.75rem}
.brand{display:inline-flex;align-items:center;gap:.5rem;background:none;border:0;padding:0;min-height:2.75rem;color:var(--ink);font-weight:700;cursor:pointer;text-align:left}
.brand svg{color:var(--brand);flex:none}
.lang{min-height:2.75rem;padding:0 1rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font-weight:700;cursor:pointer}

main{padding-top:1.5rem;padding-bottom:calc(7.5rem + env(safe-area-inset-bottom,0px))}
h1{font-size:clamp(1.85rem,7.4vw,2.35rem);line-height:1.12;letter-spacing:-.015em;margin:0 0 .75rem;font-weight:700}
h1:focus{outline:none}
h2{font-size:1.25rem;line-height:1.25;margin:2rem 0 .75rem}
h3{font-size:1.1rem;line-height:1.3;margin:0}
p{margin:0 0 1rem}
.lede{color:var(--muted);margin:0 0 1.25rem}
.meta{color:var(--muted);font-size:.92rem}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.25rem;padding:0 1.1rem;border-radius:12px;border:1.5px solid transparent;font-weight:700;text-decoration:none;cursor:pointer;text-align:center;line-height:1.2}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-crisis{background:var(--crisis);color:var(--on-crisis)}
.btn-quiet{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-block{display:flex;width:100%}
.field{width:100%;min-height:3.25rem;padding:0 1rem;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
.search{display:flex;gap:.5rem}
.search .field{flex:1;min-width:0}
textarea.field{padding:.75rem 1rem;min-height:7rem;resize:vertical}
.link{background:none;border:0;padding:.5rem 0;color:var(--brand);font-weight:700;text-decoration:underline;cursor:pointer;min-height:2.75rem}

/* start-here list */
.paths{list-style:none;margin:0 0 1rem;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.paths li+li{border-top:1px solid var(--line)}
.path{display:flex;width:100%;align-items:center;gap:.75rem;padding:1rem;background:none;border:0;border-left:6px solid transparent;text-align:left;color:inherit;cursor:pointer;min-height:4.25rem}
.path.now{border-left-color:var(--crisis)}
.path .grow{flex:1}
.path strong{display:block}
.path .sub{display:block;color:var(--muted);font-size:.95rem;line-height:1.35}
.path svg{flex:none;color:var(--muted)}

/* accordions */
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 .5rem}
summary{cursor:pointer;padding:.85rem 1rem;font-weight:700;min-height:3rem;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:1rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.5rem;line-height:1;color:var(--muted)}
details[open] summary::after{content:"\2013"}
details .body{padding:0 1rem 1rem}

/* filters */
.chips{display:flex;gap:.5rem;overflow-x:auto;margin:.75rem -1.125rem .25rem;padding:.25rem 1.125rem .5rem}
.flags{display:flex;flex-wrap:wrap;gap:.5rem;margin:.25rem 0 1rem}
.chip{flex:none;min-height:2.75rem;padding:0 1rem;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:700}
.chip[aria-pressed="true"]::before{content:"\2713\00a0"}
.count{font-weight:700;margin:0 0 .5rem}
.tagline{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--soft);border-radius:12px;padding:.25rem .5rem .25rem 1rem;margin:0 0 .75rem}
.tagline span{padding:.5rem 0}
.note{background:var(--soft);border-radius:12px;padding:.75rem 1rem;font-size:.95rem;margin:0 0 .75rem}

/* results */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{position:relative;padding:1rem}
.item+.item{border-top:1px solid var(--line)}
.item h3 a{color:var(--ink);text-decoration:none}
.item h3 a::after{content:"";position:absolute;inset:0}
.item h3 a:focus-visible{outline:none}
.item h3 a:focus-visible::after{outline:3px solid var(--brand);outline-offset:-3px;border-radius:16px}
.item p{margin:.5rem 0 .75rem;color:var(--muted);font-size:.98rem}
.badges{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0 0;padding:0;list-style:none}
.badge{font-size:.85rem;line-height:1;padding:.35rem .55rem;border-radius:6px;background:var(--soft);color:var(--brand);font-weight:700}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.mini{position:relative;z-index:1;display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem;padding:0 .9rem;border-radius:10px;border:1.5px solid var(--line);color:var(--brand);font-weight:700;text-decoration:none;background:var(--surface)}

/* detail */
.back{background:none;border:0;color:var(--brand);font-weight:700;min-height:2.75rem;padding:0;display:inline-flex;align-items:center;gap:.25rem;cursor:pointer;margin:0 0 .5rem}
.kicker{color:var(--muted);margin:0 0 .25rem;font-size:.95rem}
.actions{display:grid;gap:.6rem;margin:1.25rem 0 1.5rem}
.facts{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.facts div{padding:.9rem 1rem}
.facts div+div{border-top:1px solid var(--line)}
.facts dt{font-weight:700;margin:0 0 .15rem}
.facts dd{margin:0}
.tip{border-left:6px solid var(--brand);background:var(--soft);padding:.9rem 1rem;border-radius:0 12px 12px 0;margin:1.25rem 0}
.tip strong{display:block}

/* forms */
.opts{border:0;padding:0;margin:0 0 1rem}
.opts legend{font-weight:700;margin-bottom:.5rem;padding:0}
.opt{display:flex;align-items:center;gap:.75rem;min-height:3rem;padding:.5rem 1rem;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;margin-bottom:.5rem;cursor:pointer}
.opt input{width:1.25rem;height:1.25rem;accent-color:var(--brand);flex:none}
.err{color:var(--crisis);font-weight:700}
.ok-msg{background:var(--ok-soft);color:var(--ink);border-left:6px solid var(--ok);padding:.9rem 1rem;border-radius:0 12px 12px 0}
label.lbl{display:block;font-weight:700;margin:0 0 .5rem}

/* bottom dock: the crisis button stays on every screen */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:.6rem 0 calc(.6rem + env(safe-area-inset-bottom,0px))}
.dock .wrap{display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:.5rem}
.dock .btn{min-height:3.5rem;padding:0 .5rem;font-size:1rem}
.dock .btn svg{flex:none}
.dock a[aria-current="page"]{background:var(--soft);border-color:var(--brand);color:var(--brand)}

/* crisis sheet */
dialog{margin:auto auto 0;width:100%;max-width:32.5rem;border:0;border-radius:22px 22px 0 0;padding:0;background:var(--bg);color:var(--ink);max-height:92dvh;overflow:auto}
.sheet{padding:1.25rem 1.125rem calc(1.25rem + env(safe-area-inset-bottom,0px))}
dialog::backdrop{background:rgba(8,18,23,.6)}
dialog[open]{animation:sheet .22s ease-out}
@keyframes sheet{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-title{font-size:1.5rem;margin:0 0 .75rem}
.danger{display:flex;flex-direction:column;gap:.75rem;background:var(--crisis-soft);border:1.5px solid var(--crisis);border-radius:14px;padding:1rem;margin:0 0 1rem}
.danger p{margin:0}
.panel{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0 0 1rem;background:var(--surface)}
.act{display:flex;align-items:center;gap:.9rem;padding:.85rem 1rem;min-height:4.25rem;color:var(--ink);text-decoration:none}
.act+.act{border-top:1px solid var(--line)}
.act .ic{flex:none;width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--brand)}
.act.primary .ic{background:var(--crisis);color:var(--on-crisis)}
.act b{display:block}
.act small{display:block;color:var(--muted);font-size:.92rem;line-height:1.3}

@media (prefers-reduced-motion: reduce){
  dialog[open]{animation:none}
  *{scroll-behavior:auto!important}
}
</style>
</head>

    <button class="brand" id="brand" data-act="home"></button>

</header>

<main>
  <div class="wrap" id="view"></div>
</main>

<nav class="dock" aria-label="Main">
  <div class="wrap" id="dock"></div>
</nav>

<dialog id="crisis" aria-labelledby="crisisTitle"></dialog>

  /* ------------------------------------------------------------------
     STATE
     ------------------------------------------------------------------ */
  var nav = (navigator.language || "en").toLowerCase();
  var state = {
    lang: nav.indexOf("es") === 0 ? "es" : "en",
    q: "", cat: "all", flags: {}, tag: null
  };
  var findScroll = 0, restoreFind = false;

  var FLAGS = {
    open24: function (r) { return r.h24; },
    free: function (r) { return r.free || r.noIns; },
    spanish: function (r) { return r.spanish; },
    text: function (r) { return r.text; },
    local: function (r) { return r.scope === "local"; }
  };

  /* ------------------------------------------------------------------
     HELPERS
     ------------------------------------------------------------------ */
  function $(s, el) { return (el || document).querySelector(s); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function t(key) {
    var v = T[state.lang][key];
    if (v === undefined) v = T.en[key];
    if (typeof v === "function") return v.apply(null, Array.prototype.slice.call(arguments, 1));
    return v;
  }
  function L(o) { return o && typeof o === "object" ? (o[state.lang] || o.en) : o; }
  function norm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  function byId(id) { for (var i = 0; i < RES.length; i++) if (RES[i].id === id) return RES[i]; return null; }
  function hasFlags() { for (var k in state.flags) if (state.flags[k]) return true; return false; }
  function resetFilters() { state.q = ""; state.cat = "all"; state.flags = {}; state.tag = null; }
  function phoneLabel(p) { return p.d + (p.note ? " (" + L(p.note) + ")" : ""); }
  function mapsUrl(addr) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addr); }

  function matches(r) {
    if (state.cat !== "all" && r.cat !== state.cat) return false;
    for (var f in state.flags) if (state.flags[f] && !FLAGS[f](r)) return false;
    if (state.tag && (r.tags || []).indexOf(state.tag) < 0) return false;
    if (state.q) {
      var hay = norm(r.name + " " + r.desc.en + " " + r.desc.es + " " + (r.kw || "") + " " + L(CATS[r.cat]));
      var words = norm(state.q).split(/\s+/).filter(Boolean);
      for (var i = 0; i < words.length; i++) if (hay.indexOf(words[i]) < 0) return false;
    }
    return true;
  }

  /* ------------------------------------------------------------------

     ------------------------------------------------------------------ */
  function render(opts) {
    opts = opts || {};
    var parts = (location.hash || "#/").slice(2).split("/");
    var name = parts[0], arg = parts.slice(1).join("/");
    var html, title = CONFIG.appName;
    if (name === "find") { html = viewFind(); title = t("findTitle"); }
    else if (name === "about") { html = viewAbout(); title = t("aboutTitle"); }
    else if (name === "l") { html = viewListing(arg); var r = byId(arg); if (r) title = r.name; }
    else if (name === "report") { html = viewReport(arg); title = t("reportTitle"); }
    else { html = viewHome(); }
    $("#view").innerHTML = html;
    document.title = title === CONFIG.appName ? title : title + " | " + CONFIG.appName;
    renderChrome();
    if (!opts.keep) {
      if (name === "find" && restoreFind) window.scrollTo(0, findScroll);
      else window.scrollTo(0, 0);
      restoreFind = false;
      var h1 = $("#h1");
      if (h1) h1.focus({ preventScroll: true });
    }
  }

  function go(hash) {
    if (location.hash === hash || (hash === "#/" && !location.hash)) render();
    else location.hash = hash;
  }

    var dlg = $("#crisis");
    if (e.target === dlg) { dlg.close(); return; }
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");
    if (act === "lang") {
      state.lang = state.lang === "en" ? "es" : "en";
      render({ keep: true });
    } else if (act === "home") {
      go("#/");
    } else if (act === "crisis") {
      openCrisis();
    } else if (act === "closeCrisis") {
      dlg.close();
    } else if (act === "open") {
      findScroll = window.scrollY;
    } else if (act === "back") {
      var to = el.getAttribute("data-to");
      restoreFind = to === "#/find";
      go(to);
    } else if (act === "path") {
      var k = el.getAttribute("data-path");
      if (k === "now") { openCrisis(); return; }
      resetFilters();
      if (k === "talk") state.tag = "talk";
      if (k === "care") state.tag = "ongoing";
      if (k === "family") state.tag = "family";
      if (k === "cost") state.flags.free = true;
      go("#/find");
    } else if (act === "cat") {
      state.cat = el.getAttribute("data-cat");
      syncFind();
    } else if (act === "flag") {
      var f = el.getAttribute("data-flag");
      state.flags[f] = !state.flags[f];
      syncFind();
    } else if (act === "cleartag") {
      state.tag = null;
      syncFind();
    } else if (act === "clear") {
      resetFilters();
      var q = $("#q1"); if (q) q.value = "";
      syncFind();
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.getAttribute && e.target.getAttribute("data-input") === "q") {
      state.q = e.target.value;
      syncFind();
    }
  });

  document.addEventListener("submit", function (e) {
    var form = e.target.closest("[data-form]");
    if (!form) return;
    e.preventDefault();
    var kind = form.getAttribute("data-form");
    if (kind === "search") {
      var v = $("#q0").value;
      resetFilters();
      state.q = v.trim();
      go("#/find");
    } else if (kind === "report") {
      var sel = form.querySelector('input[name="reason"]:checked');
      var err = $("#reportErr"), msg = $("#reportMsg");
      if (!sel) { err.hidden = false; return; }
      err.hidden = true;
      var id = form.getAttribute("data-id"), r = byId(id);
      var reasons = (r ? T.en.reasonsListing : T.en.reasonsGeneral);
      var label = "";
      reasons.forEach(function (x) { if (x[0] === sel.value) label = x[1]; });
      var body = CONFIG.appName + " report\nListing: " + (r ? r.name + " (" + r.id + ")" : "General") +
        "\nProblem: " + label + "\nDetails: " + ($("#note").value || "(none)");
      if (CONFIG.reportEmail) {
        location.href = "mailto:" + CONFIG.reportEmail + "?subject=" + encodeURIComponent(CONFIG.appName + " report") + "&body=" + encodeURIComponent(body);
        msg.innerHTML = '<div class="ok-msg">' + t("sentMail") + "</div>";
      } else {
        try { if (navigator.clipboard) navigator.clipboard.writeText(body); } catch (x) { /* clipboard blocked */ }
        msg.innerHTML = '<div class="ok-msg">' + t("sentCopy") + "</div>";
      }
    }
  });

  window.addEventListener("hashchange", function () { render(); });

  renderChrome();
  render({ keep: true });
})();
</script>
</body>
</html>
